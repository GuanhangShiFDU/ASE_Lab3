x-service: &service
  init: true
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 2s
    timeout: 2s
    retries: 15
services:
  db:
    build: ./database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lab3-dev-root}
      MYSQL_ROOT_HOST: localhost
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-lab3-dev-order}
      ORDER_QUERY_DB_PASSWORD: ${ORDER_QUERY_DB_PASSWORD:-lab3-dev-order-query}
      DRIVER_DB_PASSWORD: ${DRIVER_DB_PASSWORD:-lab3-dev-driver}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-lab3-dev-dispatch}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$DRIVER_DB_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -ulab3_driver_app -N -e 'SELECT 1 FROM lab3_driver.demo_accounts LIMIT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30
  order:
    <<: *service
    build:
      context: .
      args:
        SERVICE: order
    environment:
      DB_HOST: db
      DB_NAME: lab3_order
      DRIVER_URL: http://driver:3000
      ORDER_QUERY_URL: http://order-query:3000
      LAB3_AUTH_SIGNING_KEY: ${LAB3_AUTH_SIGNING_KEY:-lab3-dev-user-signing-key}
      LAB3_INTERNAL_TOKEN: ${LAB3_INTERNAL_TOKEN:-lab3-dev-internal-token}
      DB_USER: lab3_order_app
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-lab3-dev-order}
    ports:
      - "127.0.0.1:${ORDER_PORT:-18101}:3000"
  order-query:
    <<: *service
    build:
      context: .
      args:
        SERVICE: order-query
    environment:
      DB_HOST: db
      DB_NAME: lab3_order_query
      LAB3_AUTH_SIGNING_KEY: ${LAB3_AUTH_SIGNING_KEY:-lab3-dev-user-signing-key}
      DRIVER_URL: http://driver:3000
      LAB3_INTERNAL_TOKEN: ${LAB3_INTERNAL_TOKEN:-lab3-dev-internal-token}
      DB_USER: lab3_order_query_app
      DB_PASSWORD: ${ORDER_QUERY_DB_PASSWORD:-lab3-dev-order-query}
    ports:
      - "127.0.0.1:${ORDER_QUERY_PORT:-18102}:3000"
  driver:
    <<: *service
    build:
      context: .
      args:
        SERVICE: driver
    environment:
      DB_HOST: db
      DB_NAME: lab3_driver
      LAB3_AUTH_SIGNING_KEY: ${LAB3_AUTH_SIGNING_KEY:-lab3-dev-user-signing-key}
      LAB3_INTERNAL_TOKEN: ${LAB3_INTERNAL_TOKEN:-lab3-dev-internal-token}
      DB_USER: lab3_driver_app
      DB_PASSWORD: ${DRIVER_DB_PASSWORD:-lab3-dev-driver}
    ports:
      - "127.0.0.1:${DRIVER_PORT:-18103}:3000"
  dispatch:
    <<: *service
    build:
      context: .
      args:
        SERVICE: dispatch
    environment:
      DB_HOST: db
      DB_NAME: lab3_dispatch
      LAB3_AUTH_SIGNING_KEY: ${LAB3_AUTH_SIGNING_KEY:-lab3-dev-user-signing-key}
      LAB3_INTERNAL_TOKEN: ${LAB3_INTERNAL_TOKEN:-lab3-dev-internal-token}
      DRIVER_URL: http://driver:3000
      ORDER_URL: http://order:3000
      DISPATCH_OFFER_MS: ${DISPATCH_OFFER_MS:-15000}
      DISPATCH_MATCH_MS: ${DISPATCH_MATCH_MS:-60000}
      DISPATCH_POLL_MS: ${DISPATCH_POLL_MS:-500}
      DB_USER: lab3_dispatch_app
      DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-lab3-dev-dispatch}
    ports:
      - "127.0.0.1:${DISPATCH_PORT:-18104}:3000"

volumes:
  mysql_data:
