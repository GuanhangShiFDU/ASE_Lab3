services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lab3_order_test
      MYSQL_USER: order_test
      MYSQL_PASSWORD: order-test-fixture
      MYSQL_ROOT_PASSWORD: root-test-fixture
      MYSQL_ROOT_HOST: localhost
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30
  component:
    build:
      context: .
      dockerfile: services/order/test/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: lab3_order_test
      DB_USER: order_test
      DB_PASSWORD: order-test-fixture
    depends_on:
      db:
        condition: service_healthy
