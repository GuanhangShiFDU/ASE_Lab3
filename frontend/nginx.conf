server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 16k;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/api/(auth/login|drivers/me/status)$ {
        set $service driver;
        include /etc/nginx/lab3-proxy.inc;
    }
    location ~ ^/api/(drivers/me/offers|offers/[0-9a-f-]+(/(accept|reject))?)$ {
        set $service dispatch;
        include /etc/nginx/lab3-proxy.inc;
    }
    location ~ ^/api/(orders(/estimate|/[0-9a-f-]+/(cancel|arrive|start|finish))?)$ {
        set $service order;
        include /etc/nginx/lab3-proxy.inc;
    }
    location ~ ^/api/(orders/(history|current|[0-9a-f-]+)|drivers/me/order)$ {
        set $service order-query;
        include /etc/nginx/lab3-proxy.inc;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
